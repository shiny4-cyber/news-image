<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Day - Wednesday 18 November 2026</title>
<!--
  One editorial front page for Wednesday 18 November 2026, set at 1600 x 1600 CSS px.
  tools/render.mjs screenshots it at a device scale factor of 0.64, which lands the PNG on
  exactly 1024 x 1024 px, the largest square the gate accepts.
-->
<style>
  :root{
    --bg:#08090c;
    --ink:#f4f1ea;
    --dim:#9aa2b1;
    --line:#232935;
    --accent:#ff5a3c;
    --pad:58px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1600px;height:1600px;background:var(--bg);overflow:hidden}
  body{
    color:var(--ink);
    font-family:"Liberation Serif","DejaVu Serif",serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    width:1600px;height:1600px;
    padding:46px var(--pad) 0;
    display:flex;flex-direction:column;
    border-top:7px solid var(--accent);
  }

  /* type roles */
  .display{
    font-family:"Liberation Sans Narrow","Liberation Sans",sans-serif;
    font-weight:700;text-transform:uppercase;letter-spacing:-0.6px;
  }
  .label{
    font-family:"Liberation Sans","DejaVu Sans",sans-serif;
    font-weight:700;text-transform:uppercase;
    letter-spacing:0.24em;color:var(--dim);
  }
  .kick{
    font-family:"Liberation Sans","DejaVu Sans",sans-serif;
    font-weight:700;text-transform:uppercase;
    letter-spacing:0.2em;color:var(--accent);
  }

  /* masthead */
  .mast-top{display:flex;justify-content:space-between;align-items:baseline;font-size:21px}
  .date{
    font-size:70px;line-height:1;color:var(--ink);
    margin:12px 0 0;display:flex;gap:0.4em;flex-wrap:nowrap;
  }
  .date em{font-style:normal;color:var(--accent)}
  .mast-rule{height:3px;background:var(--accent);margin-top:14px}
  .mast-rule2{height:1px;background:var(--line);margin-top:5px}

  /* hero */
  .hero{margin-top:28px;padding-left:34px;border-left:9px solid var(--accent)}
  .hero .kick{font-size:24px}
  .hero-h{font-size:108px;line-height:0.92;margin:16px 0 14px;max-width:1430px}
  .hero-deck{font-size:33px;line-height:1.26;color:#dcd8cf;max-width:1330px}

  /* secondary pair */
  .second{
    display:grid;grid-template-columns:1fr 1fr;column-gap:56px;
    margin-top:36px;padding-top:20px;border-top:1px solid var(--line);
  }
  .second article{border-left:3px solid var(--line);padding-left:22px}
  .second .kick{font-size:20px}
  .second h3{font-size:52px;line-height:0.94;margin:12px 0 10px}
  .second p{font-size:26px;line-height:1.25;color:#c8c4bb;max-width:660px}

  /* grid */
  .grid{
    margin-top:30px;padding-top:6px;border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;
    flex:1;
  }
  .cell{padding:18px 26px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-start}
  .cell:nth-child(3n+1){padding-left:0}
  .cell:nth-child(3n){padding-right:0}
  .cell:nth-child(3n+2),.cell:nth-child(3n){border-left:1px solid var(--line)}
  .cell-top{display:flex;align-items:baseline;gap:14px}
  .num{
    font-family:"Liberation Sans",sans-serif;font-weight:700;font-size:19px;
    color:var(--accent);letter-spacing:0.06em;
  }
  .cell .kick{font-size:19px;letter-spacing:0.2em;color:var(--dim)}
  .cell h3{font-size:46px;line-height:0.98;margin:10px 0 8px}
  .cell p{font-size:26px;line-height:1.24;color:#a9b0bd;margin-top:auto;padding-top:10px}

  /* ticker */
  .ticker{border-top:3px solid var(--accent);margin-top:0;padding:14px 0 0}
  .ticker .kick{font-size:19px;letter-spacing:0.26em;margin-bottom:10px}
  .tick{font-size:26px;line-height:1.32;color:#dcd8cf}
  .tick b{font-family:"Liberation Sans",sans-serif;font-weight:700;font-size:22px;letter-spacing:0.02em;text-transform:uppercase}
  .meta{font-size:17px;letter-spacing:0.18em;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
</style>
</head>
<body>
  <div class="page" id="page"></div>
  <div id="audit" style="display:none"></div>
  <div id="metrics" style="display:none"></div>
  <script src="news.js"></script>
</body>
</html>
